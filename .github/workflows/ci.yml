# ============================================================
# CI — lint + build on every push and pull request.
# Runs frontend lint+build and backend syntax check in parallel.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend: lint + build ───
  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  # ─── Backend: syntax check all route files ───
  backend:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --omit=dev
      - name: Syntax check (index + all routes + middleware)
        working-directory: backend
        run: |
          for f in index.js db.js \
                   routes/*.js \
                   middleware/*.js \
                   services/*.js \
                   scripts/*.js; do
            node -c "$f" || exit 1
          done
          echo "All backend files syntax OK ✅"
