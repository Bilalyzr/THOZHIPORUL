# Netlify deployment config for THOZHIPORUL (THOZHIRPORUL / SIPCOT Industrial OS)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
#
# This file makes the build settings explicit and version-controlled so the
# deploy is deterministic (no guessing the publish directory in the dashboard).

[build]
  # The frontend (package.json + vite build) lives in frontend/, NOT the repo
  # root. `base` tells Netlify to cd into frontend/ before running the command,
  # and `publish` is then relative to that base directory.
  base = "frontend/"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so client-side React Router handles every path (no 404 on refresh).
# Mirrors frontend/public/_redirects; having it here too is belt-and-suspenders.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic security headers at the Netlify edge (mirrors _headers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache Vite's fingerprinted assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
